[tool.poetry]
name = "pdf-forensics-platform"
version = "0.1.0"
description = "Industrial-grade PDF forensics analysis platform: structural, metadata and object-graph analysis of PDF documents."
authors = ["Visual Forensics Radar"]
readme = "README.md"
packages = [
  { include = "pdf_forensics", from = "src" },
  { include = "pdf_forensics_api", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
scikit-learn = "^1.5"
torch = { version = "^2.4", source = "pytorch-cpu" }
xgboost = "^2.1"
shap = "^0.46"
# shap pulls in numba (for its fast TreeExplainer path), whose own default
# resolution can drag in a pre-3.12 llvmlite that fails to build under
# Python 3.12 (setuptools' spawn() signature changed). Pinning numba
# explicitly to a version with real 3.12 support forces a compatible
# llvmlite to be selected too.
numba = "^0.60"
# Persists fitted Anomaly Detection / ML Ensemble plugin instances to disk
# (application/model_persistence/). scikit-learn already depends on joblib
# transitively; declared directly here since our own code imports it.
joblib = "^1.4"
# Validates embedded PDF digital signatures (application/signature_verification/) —
# PKCS#7/CMS parsing and cryptographic verification is deliberately NOT
# hand-rolled from scratch (unlike Module 1's own PDF object parser): this is
# exactly the kind of security-sensitive parsing where using a well-tested,
# actively maintained library is the responsible choice.
pyhanko = "^0.36"
# Verification API (src/pdf_forensics_api/) — a separate top-level package
# from pdf_forensics itself, so the core library stays free of web-framework
# concerns (see its own module docstring).
fastapi = "^0.115"
uvicorn = "^0.32"
# Required by FastAPI/Starlette at runtime for multipart form/file uploads
# (the /verify and /training-data/* endpoints), not just for tests.
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
black = "^24.10"
ruff = "^0.6.9"
mypy = "^1.11"
pytest = "^8.3"
pytest-cov = "^5.0"
pre-commit = "^3.8"
# fastapi.testclient.TestClient requires httpx explicitly.
httpx = "^0.27"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# scikit-learn and shap ship no inline types/py.typed marker as of these
# versions; torch and xgboost do and need no override. Scoped to these two
# modules only, not a blanket relaxation of strict mode.
module = ["sklearn.*", "shap.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/pdf_forensics --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["src/pdf_forensics"]
