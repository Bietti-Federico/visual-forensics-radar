[tool.poetry]
name = "pdf-forensics-platform"
version = "0.1.0"
description = "Industrial-grade PDF forensics analysis platform: structural, metadata and object-graph analysis of PDF documents."
authors = ["Visual Forensics Radar"]
readme = "README.md"
packages = [{ include = "pdf_forensics", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
black = "^24.10"
ruff = "^0.6.9"
mypy = "^1.11"
pytest = "^8.3"
pytest-cov = "^5.0"
pre-commit = "^3.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/pdf_forensics --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["src/pdf_forensics"]
